<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CODE RED &amp; CODE PIXEL – Support tickets</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#14213d;--mute:#5b6679;--line:#d9dfe8;--accent:#2f5bea;--accent-ink:#fff;--sq:#e3e8f0;
--open:#c2410c;--open-bg:#ffedd5;--pend:#8a6d00;--pend-bg:#fef3c7;--done:#166534;--done-bg:#dcfce7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--panel:#161e33;--ink:#e8ecf6;--mute:#96a1b8;--line:#2a3452;--accent:#7b9bff;--accent-ink:#0e1424;--sq:#1c2540;
--open:#fdba74;--open-bg:#3a2210;--pend:#fde68a;--pend-bg:#3a3010;--done:#86efac;--done-bg:#12301c}}
:root[data-theme="dark"]{--bg:#0e1424;--panel:#161e33;--ink:#e8ecf6;--mute:#96a1b8;--line:#2a3452;--accent:#7b9bff;--accent-ink:#0e1424;--sq:#1c2540;
--open:#fdba74;--open-bg:#3a2210;--pend:#fde68a;--pend-bg:#3a3010;--done:#86efac;--done-bg:#12301c}
:root[data-team="red"]{--accent:#d62839;--accent-ink:#fff}
:root[data-team="pixel"]{--accent:#7c3aed;--accent-ink:#fff}
#home{display:none;min-height:calc(100dvh - var(--hh,62px));align-items:center;justify-content:center;padding:24px}
body.home #home{display:grid}
body.home main,body.home .teams,body.home #newBtn,body.home #homeBtn{display:none}
.pick{width:min(720px,100%);text-align:center}
.pick h1{font-size:clamp(28px,6vw,44px);margin:0 0 24px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:44px 16px;font:700 clamp(20px,4vw,30px)/1.1 Sora,system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.choice[data-t="red"]:hover,.choice[data-t="red"]:focus-visible{border-color:#d62839;background:#d62839;color:#fff}
.choice[data-t="pixel"]:hover,.choice[data-t="pixel"]:focus-visible{border-color:#7c3aed;background:#7c3aed;color:#fff}
.choice.all{grid-column:1/-1;padding:24px 16px}
.choice.all:hover,.choice.all:focus-visible{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
[hidden]{display:none!important}
@media (max-width:760px){.choices{grid-template-columns:1fr}}
.teams{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--line)}
.team{border:0;background:transparent;border-radius:7px;padding:7px 14px;font-weight:700;cursor:pointer;color:var(--mute)}
.team[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Sora,system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);
background-image:repeating-conic-gradient(var(--sq) 0 25%,transparent 0 50%);background-size:20px 20px;background-position:right top;}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;background:var(--panel);padding:2px 10px 2px 0}
.logo small{font-weight:400;color:var(--mute);font-size:13px;margin-left:8px}
.sp{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;height:calc(100vh - var(--hh,62px));height:calc(100dvh - var(--hh,62px) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.tools{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.tools input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows{overflow:auto;flex:1}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer}
.row:hover{background:var(--bg)}
.row[aria-current="true"]{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent)}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:12.5px;margin-top:4px}
.badge{border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}
.s-open{background:var(--open-bg);color:var(--open)}.s-pending{background:var(--pend-bg);color:var(--pend)}.s-solved{background:var(--done-bg);color:var(--done)}
.empty{padding:32px 20px;color:var(--mute);text-align:center}
.detail{overflow:auto;padding:24px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:760px}
.back{display:none;margin-bottom:12px}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 6px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.ctl label{font-size:13px;color:var(--mute);display:grid;gap:4px}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.msg{border-top:1px solid var(--line);padding:14px 0}
.msg.agent{background:linear-gradient(90deg,var(--bg),transparent);margin:0 -20px;padding:14px 20px}
.msg .who{font-weight:600;font-size:13px}.msg .who span{color:var(--mute);font-weight:400;margin-left:6px}
.msg p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px;width:min(480px,92vw)}
.vw{border:0;background:transparent;border-radius:7px;padding:7px 12px;font-weight:600;cursor:pointer;color:var(--mute)}
.vw[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#panel{display:none;padding:20px;max-width:1000px;margin:0 auto}
body.v-inventory #panel,body.v-staff #panel{display:block}
body.v-inventory main,body.v-staff main,body.v-inventory #newBtn,body.v-staff #newBtn{display:none}
.add{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.add label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.add input,.add select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:150px}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:13px;color:var(--mute);font-weight:600}tr:last-child td{border-bottom:0}
td select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:3px 10px;cursor:pointer}
.muted{color:var(--mute);margin:0}
.pos{border:1px solid var(--line);border-radius:10px;padding:14px;margin:16px 0;background:var(--bg)}
.pos .who{font-weight:600}.pos table{width:100%}.pos td{padding:6px 8px;white-space:normal}
.prow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prow input,.prow select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:0;flex:1 1 90px}
.prow input[aria-invalid="true"]{border-color:var(--open)}
.hrs[aria-invalid="true"]{border-color:var(--open)}
.tot{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:12px}
.till{display:grid;grid-template-columns:1fr minmax(280px,360px);gap:20px;align-items:start;margin:14px 0}
.till h2,#panel h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.prod{display:grid;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;color:var(--ink)}
.prod:hover:not(:disabled){border-color:var(--accent)}.prod:disabled{opacity:.5;cursor:not-allowed}.prod small{color:var(--mute)}
.cart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:10px}
.cl{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center}
.done{background:var(--done-bg);color:var(--done);border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:600}
#login{display:none;min-height:100dvh;place-items:center;padding:24px}
body.locked #login{display:grid}
body.locked header,body.locked main,body.locked #panel,body.locked #home{display:none!important}
.lcard{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
.err{color:var(--open);min-height:1.2em;font-size:13px}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.seg .vw{flex:1}
#portal{display:none;max-width:760px;margin:0 auto;padding:20px}
body.cust #portal{display:block}
body.locked #portal{display:none!important}
body.cust main,body.cust #panel,body.cust #home,body.cust .teams,body.cust #homeBtn,body.cust #newBtn{display:none!important}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tk{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;cursor:pointer;color:var(--ink)}
.tk b{display:block}
@media (max-width:760px){.till{grid-template-columns:1fr}}
.hrs{width:80px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
dialog{max-height:92dvh;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info{display:flex;flex-wrap:wrap;gap:6px 24px;margin:14px 0 0}.info dt{font-size:12px;color:var(--mute)}.info dd{margin:0;font-size:14px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
dialog::backdrop{background:rgba(10,15,30,.5)}
form{display:grid;gap:12px}
form label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
form input,form select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
@media (max-width:760px){main{grid-template-columns:1fr}.detail{display:none}main.show .list{display:none}main.show .detail{display:block;padding:14px}.back{display:inline-block}.logo{display:none}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>
</head>
<body>
<header>
  <button class="btn ghost" id="homeBtn">Home</button>
  <div class="teams" id="teams" role="group" aria-label="Team"><button class="team" data-t="red">CODE RED</button><button class="team" data-t="pixel">CODE PIXEL</button><button class="team" data-t="all">ALL</button></div>
  <div class="teams" id="views" role="group" aria-label="Section"><button class="vw" data-v="tickets">Tickets</button><button class="vw" data-v="inventory">Inventory</button><button class="vw" data-v="staff">Staff</button><button class="vw" data-v="pos">POS</button><button class="vw" data-v="customers">Customers</button></div>
  <div class="sp"></div><span id="who" class="muted"></span>
  <button class="btn" id="newBtn">New ticket</button>
  <button class="btn ghost" id="outBtn">Sign out</button>
</header>
<section id="home"><div class="pick"><h1>Pick one</h1><div class="choices"><button class="choice" data-t="red">Code RED</button><button class="choice" data-t="pixel">Code PIXEL</button><button class="choice all" data-t="all">All</button></div></div></section>
<main id="main">
  <section class="list" aria-label="Tickets">
    <div class="tools">
      <input id="q" type="search" placeholder="Search tickets" aria-label="Search tickets">
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="rows" id="rows"></div>
  </section>
  <section class="detail" id="detail" aria-live="polite"></section>
</main>

<section id="login" aria-live="polite"></section>
<section id="portal" aria-live="polite"></section>
<section id="panel" aria-live="polite"></section>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h1>New ticket</h1>
    <label>Your name<input name="name" required autocomplete="name"></label>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Subject<input name="subject" required maxlength="120"></label>
    <div class="two"><label>Category<select name="category"><option>Bug</option><option>Billing</option><option>Account</option><option>Feature request</option><option>Question</option><option>Other</option></select></label>
    <label>Who’s affected<select name="affects"><option>Just me</option><option>My team</option><option>Everyone</option></select></label></div>
    <div class="two"><label>Phone (optional)<input name="phone" type="tel" autocomplete="tel"></label>
    <label>Order or reference no. (optional)<input name="ref" maxlength="40"></label></div>
    <label>Best way to reach you<select name="contact"><option>Email</option><option>Phone</option></select></label>
    <label id="deskLbl" hidden>Desk<select id="deskSel" name="team"><option value="red">Code RED</option><option value="pixel">Code PIXEL</option></select></label>
    <label>Priority<select name="priority"><option>Low</option><option selected>Normal</option><option>High</option><option>Urgent</option></select></label>
    <label>What’s happening?<textarea name="body" required placeholder="Describe the problem and what you expected to happen."></textarea></label>
    <label>Steps to reproduce (optional)<textarea name="steps" style="min-height:60px"></textarea></label>
    <div class="acts"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn" type="submit">Create ticket</button></div>
  </form>
</dialog>

<script>
(function(){
var KEY="code-desk-v3", FILTERS=["All","Open","Pending","Solved"];
var now=Date.now(), H=3600000;
var seed=[
 {id:1042,subject:"Can’t reset my password",name:"Maya Chen",email:"maya@example.com",priority:"High",status:"Open",created:now-2*H,replies:[{who:"Maya Chen",agent:false,text:"The reset email never arrives. I’ve checked spam twice.",t:now-2*H}]},
 {id:1041,subject:"Invoice shows the wrong billing address",name:"Tom Ruiz",email:"tom@example.com",priority:"Normal",status:"Pending",created:now-27*H,replies:[{who:"Tom Ruiz",agent:false,text:"Our March invoice lists the old office address.",t:now-27*H},{who:"Support",agent:true,text:"Thanks Tom. Could you send the new address so we can reissue it?",t:now-24*H}]},
 {id:1040,subject:"Export to CSV is missing a column",name:"Priya Nair",email:"priya@example.com",priority:"Low",status:"Solved",created:now-80*H,replies:[{who:"Priya Nair",agent:false,text:"The ‘Region’ column isn’t in the CSV export.",t:now-80*H},{who:"Support",agent:true,text:"Fixed in today’s release. Re-export and it will be there.",t:now-70*H}]},
 {id:1043,team:"pixel",subject:"Sprite sheet exports with blurry edges",name:"Jo Park",email:"jo@example.com",priority:"Normal",status:"Open",created:now-5*H,replies:[{who:"Jo Park",agent:false,text:"Exported PNGs look smoothed. I need hard pixel edges.",t:now-5*H}]},
 {id:1044,team:"pixel",subject:"Palette import fails on .gpl files",name:"Lena Ortiz",email:"lena@example.com",priority:"High",status:"Pending",created:now-30*H,replies:[{who:"Lena Ortiz",agent:false,text:"Importing a GIMP palette shows an error.",t:now-30*H},{who:"Support",agent:true,text:"Thanks Lena. Could you attach the file so we can reproduce it?",t:now-26*H}]}
];
var tickets=load(), team="red", filter="All", sel=null;
function mine(){return tickets.filter(function(t){return team==="all"||t.team===team})}
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return []}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tickets))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function ago(t){var m=Math.round((Date.now()-t)/60000);if(m<1)return"just now";if(m<60)return m+" min ago";var h=Math.round(m/60);if(h<24)return h+" h ago";return Math.round(h/24)+" d ago"}
function cls(s){return"badge s-"+s.toLowerCase()}

function renderTabs(){
 $("tabs").innerHTML=FILTERS.map(function(f){
  var n=f==="All"?mine().length:mine().filter(function(t){return t.status===f}).length;
  return '<button class="tab" data-f="'+f+'" aria-pressed="'+(f===filter)+'">'+f+" "+n+"</button>"}).join("");
}
function renderList(){
 var q=$("q").value.trim().toLowerCase();
 var list=mine().filter(function(t){return(filter==="All"||t.status===filter)&&(!q||(t.subject+t.name+t.id).toLowerCase().indexOf(q)>-1)})
  .sort(function(a,b){return b.created-a.created});
 $("rows").innerHTML=list.length?list.map(function(t){
  return '<button class="row" data-id="'+t.id+'" aria-current="'+(t.id===sel)+'"><b>'+esc(t.subject)+'</b><div class="meta"><span class="'+cls(t.status)+'">'+t.status+'</span><span>#'+t.id+'</span>'+(team==="all"?'<span>'+(t.team==="red"?"Code RED":"Code PIXEL")+'</span>':"")+'<span>'+esc(t.name)+'</span><span>'+ago(t.created)+'</span></div></button>'}).join("")
  :'<div class="empty">No tickets match. Try another filter, or create a new ticket.</div>';
}
var IK="code-desk-inv-v1",SK="code-desk-staff-v1",inv=loadK(IK),staff=loadK(SK),view="tickets";
function loadK(k){try{var s=localStorage.getItem(k);if(s)return JSON.parse(s)}catch(e){}return[]}
function saveK(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function nid(){return Date.now()*1000+Math.floor(Math.random()*1000)}
function inTeam(a){return a.filter(function(x){return team==="all"||x.team===team})}
function deskName(k){return k==="red"?"Code RED":"Code PIXEL"}
function fit(){document.documentElement.style.setProperty("--hh",document.querySelector("header").offsetHeight+"px")}
function deskSel(){return team==="all"?'<label>Desk<select name="team"><option value="red">Code RED</option><option value="pixel">Code PIXEL</option></select></label>':'<input type="hidden" name="team" value="'+team+'">'}
function assignHtml(t){var s=staff.filter(function(x){return x.team===t.team});return'<label>Assignee<select id="as"><option value="">Unassigned</option>'+s.map(function(x){return'<option value="'+x.id+'"'+(x.id===t.assignee?" selected":"")+'>'+esc(x.name)+(x.status==="Away"?" (away)":"")+'</option>'}).join("")+'</select></label>'}
function money(n){return"$"+(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function due(s){return s.ptype==="Salary"?(s.rate||0):(s.rate||0)*(s.hours||0)}
function renderPanel(){
 var h="",all=team==="all",dh=all?"<th>Desk</th>":"",ds=function(k){return all?"<td>"+deskName(k)+"</td>":""};
 if(view==="inventory"){
  var it=inTeam(inv),low=it.filter(function(i){return i.qty<=i.min}).length;
  h='<h1>Inventory</h1><p class="muted">'+it.length+' items'+(low?', '+low+' low or out of stock':'')+'</p><form class="add" id="invForm"><label>Item<input name="name" required maxlength="60"></label><label>SKU<input name="sku" maxlength="30"></label><label>In stock<input name="qty" type="number" min="0" value="0" required></label><label>Reorder at<input name="min" type="number" min="0" value="0" required></label><label>Price ($)<input name="price" type="number" min="0" step="0.01" value="0"></label><label>Location<input name="loc" maxlength="40"></label>'+deskSel()+'<button class="btn">Add item</button></form>';
  h+=it.length?'<div class="tbl"><table><thead><tr><th>Item</th><th>SKU</th><th>Location</th>'+dh+'<th>Price</th><th>Stock</th><th></th></tr></thead><tbody>'+it.map(function(i){
   var b=i.qty===0?' <span class="badge s-open">Out</span>':i.qty<=i.min?' <span class="badge s-pending">Low</span>':'';
   return'<tr><td>'+esc(i.name)+'</td><td>'+esc(i.sku||"–")+'</td><td>'+esc(i.loc||"–")+'</td>'+ds(i.team)+'<td>'+money(i.price)+'</td><td><button class="mini" data-a="dec" data-id="'+i.id+'" aria-label="Remove one">−</button> <b>'+i.qty+'</b> <button class="mini" data-a="inc" data-id="'+i.id+'" aria-label="Add one">+</button>'+b+'</td><td><button class="mini" data-a="del" data-id="'+i.id+'">Remove</button></td></tr>'}).join("")+'</tbody></table></div>':'<div class="empty">No items yet. Add your first item above.</div>';
